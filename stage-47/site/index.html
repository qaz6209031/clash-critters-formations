  <style>

    .header-controls { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
    .chapter-picker { display: flex; align-items: center; gap: 12px; }
    .chapter-picker label { font-size: 15px; font-weight: 650; }
    select { min-height: 44px; min-width: 170px; padding: 9px 36px 9px 12px; font: inherit; color: inherit; border: 1px solid #b9c8aa; border-radius: 10px; background: #fff; }
    select:focus-visible { outline: 3px solid #477c38; outline-offset: 3px; }
    .donation-links { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; }
    .donation-label { font-size: 13px; color: #536b49; }
    .donation-link { display: inline-flex; align-items: center; justify-content: center; min-height: 44px; padding: 9px 12px; border: 1px solid #b9c8aa; border-radius: 10px; background: #fff; color: #486342; font-size: 14px; font-weight: 650; text-decoration: none; white-space: nowrap; }
    .donation-link:hover { background: #edf2e6; border-color: #477c38; }
    .donation-link:focus-visible { outline: 3px solid #477c38; outline-offset: 3px; }
    main { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 22px; max-width: 1440px; margin: 0 auto; padding: 24px 24px 48px; }
    .chapter-title { grid-column: 1 / -1; margin: 0; padding: 2px 0 0; font-size: 18px; font-weight: 650; color: #536b49; scroll-margin-top: 150px; }
    #chapter-cards { display: contents; }
    .empty-chapter { grid-column: 1 / -1; margin: 0; color: #687762; line-height: 1.5; }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }
    .stage { overflow: hidden; border: 1px solid #d8e0cc; border-radius: 15px; background: #fff; }
    h2 { display: flex; align-items: center; font-size: 20px; font-weight: 700; line-height: 1.3; letter-spacing: -.4px; margin: 0; }
    h2 a { display: block; flex: 1; min-width: 0; padding: 14px 14px 12px 18px; color: inherit; text-decoration: none; }
    h2 a:hover { color: #477c38; }
    h2 a:focus-visible { outline: 3px solid #477c38; outline-offset: -4px; border-radius: 10px; }
    .level { flex-shrink: 0; padding: 5px 8px; margin: 0 14px 0 0; border-radius: 8px; background: #edf2e6; color: #486342; font-size: 12px; font-weight: 650; line-height: 1.25; letter-spacing: 0; text-align: center; white-space: nowrap; }
    .poster { margin: -2px 18px 12px; color: #687762; font-size: 12px; line-height: 1.4; overflow-wrap: anywhere; }
    .poster a { color: inherit; text-decoration: none; }
    .poster a:hover { color: #477c38; text-decoration: underline; }
    .poster a:focus-visible { outline: 2px solid #477c38; outline-offset: 3px; border-radius: 2px; }
    .board { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 3px; padding: 10px; background: #d2e2ad; }
    .cell { aspect-ratio: 1; min-width: 0; position: relative; display: flex; align-items: center; justify-content: center; background: #e9f0d4; border-radius: 4px; }
    .cell:nth-child(even) { background: #e0eac7; }
    .cell img { display: block; width: 100%; height: 100%; object-fit: contain; user-select: none; }
    .occupied:hover { background: #f4f7e6; }
    @media (min-width: 851px) { .page-header, main { width: 90%; } h1 { font-size: clamp(27px, 2.07vw, 32.4px); } h2 { font-size: clamp(18px, 1.35vw, 23.4px); } .chapter-title { font-size: 18px; } .level, .poster { font-size: 12.6px; } }
    @media (max-width: 850px) { main { grid-template-columns: repeat(2, minmax(0, 1fr)); max-width: 750px; gap: 18px; } .page-header { max-width: 750px; } }
    @media (max-width: 520px) { main { grid-template-columns: 1fr; max-width: 420px; padding: 20px 12px 32px; gap: 18px; } .page-header { max-width: 420px; padding: 20px 12px 14px; } .chapter-picker { flex: 1 1 100%; } .chapter-title { scroll-margin-top: 220px; } h2 { font-size: 18px; } h2 a { padding-left: 14px; } .level { margin-right: 10px; } .poster { margin-left: 14px; } .board { padding: 7px; gap: 2px; } select { flex: 1; } }
    @media print { :root { background: white; } .header-controls { display: none; } main { width: auto; max-width: none; padding: 0; gap: 12px; } .stage { break-inside: avoid; } }

<body>

    <div class="header-controls">

        <label for="chapter-select">Chapter</label>
        <select id="chapter-select" aria-controls="formations"><option value="10">Chapter 10</option><option value="11">Chapter 11</option><option value="12">Chapter 12</option><option value="13">Chapter 13</option><option value="14">Chapter 14</option><option value="15">Chapter 15</option><option value="16">Chapter 16</option><option value="17">Chapter 17</option><option value="18">Chapter 18</option><option value="19">Chapter 19</option><option value="20">Chapter 20</option><option value="21">Chapter 21</option><option value="22">Chapter 22</option><option value="23">Chapter 23</option><option value="24">Chapter 24</option><option value="25">Chapter 25</option><option value="26">Chapter 26</option><option value="27">Chapter 27</option><option value="28">Chapter 28</option><option value="29">Chapter 29</option><option value="30">Chapter 30</option><option value="31" selected>Chapter 31</option><option value="32">Chapter 32</option><option value="33">Chapter 33</option><option value="34">Chapter 34</option><option value="35">Chapter 35</option><option value="36">Chapter 36</option><option value="37">Chapter 37</option><option value="38">Chapter 38</option><option value="39">Chapter 39</option><option value="40">Chapter 40</option><option value="41">Chapter 41</option><option value="42">Chapter 42</option><option value="43">Chapter 43</option><option value="44">Chapter 44</option><option value="45">Chapter 45</option><option value="46">Chapter 46</option><option value="47">Chapter 47</option><option value="48">Chapter 48</option><option value="49">Chapter 49</option><option value="50">Chapter 50</option><option value="51">Chapter 51</option><option value="52">Chapter 52</option><option value="53">Chapter 53</option><option value="54">Chapter 54</option><option value="55">Chapter 55</option><option value="56">Chapter 56</option><option value="57">Chapter 57</option><option value="58">Chapter 58</option><option value="59">Chapter 59</option><option value="60">Chapter 6         <span class="donation-label">Finding these formations helpful?</span>

  <main id="formations" aria-label="Stage formations">
    <h2 class="chapter-title" id="chapter-heading"></h2>
    <div id="chapter-cards"></div>
    <p id="empty-chapter" class="empty-chapter" hidden></p>
  </main>
  <script>
    const chapterSelect = document.getElementById('chapter-select');
    const formations = document.getElementById('formations');
    const cardList = document.getElementById('chapter-cards');
    const emptyMessage = document.getElementById('empty-chapter');
    const chapters = new Set([...chapterSelect.options].map(option => option.value));
    const loaded = new Map();
    let currentChapter;
    function loadChapter(chapter) {
      if (!loaded.has(chapter)) {
        loaded.set(chapter, fetch(`chapters/${chapter}.html`).then(response => {
          if (!response.ok) throw new Error(`HTTP ${response.status}`);
          return response.text();
        }).catch(error => { loaded.delete(chapter); throw error; }));
      }
      return loaded.get(chapter);
    }
    async function showChapter(chapter) {
      if (!chapters.has(chapter)) {
        chapter = chapters.has('31') ? '31' : chapterSelect.options[0].value;
        history.replaceState(null, '', `#chapter-${chapter}`);
      }
      currentChapter = chapter;
      chapterSelect.value = chapter;
      document.getElementById('chapter-heading').textContent = `Chapter ${chapter}`;
      formations.setAttribute('aria-busy', 'true');
      let cards, status;
      try {
        cards = await loadChapter(chapter);
      } catch {
        cards = '';
        status = `Could not load chapter ${chapter}. Check your connection and choose the chapter again.`;
      }
      if (chapter !== currentChapter) return;
      const hasFormations = cards.trim() !== '';
      cardList.innerHTML = cards;
      emptyMessage.textContent = status || 'No verified formations available for this chapter yet.';
      emptyMessage.hidden = hasFormations;
      formations.removeAttribute('aria-busy');
      document.getElementById('chapter-status').textContent = status || (hasFormations
        ? `Showing chapter ${chapter} formations`
        : `No verified formations available for chapter ${chapter}`);
    }
    function chapterFromHash() {
      showChapter(location.hash.match(/^#chapter-(\d+)$/)?.[1]);
    }
    chapterSelect.addEventListener('change', () => {
      location.hash = `chapter-${chapterSelect.value}`;
      window.scrollTo({ top: 0, behavior: 'instant' });
    });
    window.addEventListener('hashchange', chapterFromHash);
    chapterFromHash();
  </script>
