  <style>
    * { box-sizing: border-box; }
    :root { color-scheme: light; font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #243b2b; background: #f5f7f0; }
    body { margin: 0; display: flex; flex-direction: column; min-height: 100vh; }

    .stage-search { display: flex; align-items: center; gap: 8px; }

    .chapter-pagination a, .chapter-pagination span { padding: 8px 12px; border-radius: 8px; text-decoration: none; font-size: 14px; font-weight: 650; }
    .chapter-pagination a { background: #fff; border: 1px solid #b9c8aa; color: #486342; }
    .chapter-pagination a:hover { background: #edf2e6; border-color: #477c38; }
    .chapter-pagination .disabled { color: #a9b79d; }
    main { flex: 1; max-width: 1440px; margin: 0 auto; padding: 10px 24px 48px; width: 100%; }
    .intro { max-width: 760px; line-height: 1.6; }
    .intro p { margin: 0 0 14px; }
    h1 { font-size: 26px; font-weight: 750; letter-spacing: -.4px; margin: 6px 0 14px; }
    h2.section-heading { font-size: 18px; font-weight: 700; margin: 24px 0 12px; }
    .chapter-grid { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
    .chapter-grid li { margin: 0; }
    .chapter-grid a { display: block; padding: 12px 14px; border: 1px solid #d8e0cc; border-radius: 12px; background: #fff; text-decoration: none; }
    .chapter-grid a:hover { border-color: #477c38; background: #f4f7e6; }
    .chapter-grid .chapter-name { display: block; font-weight: 650; }
    .chapter-grid .chapter-count { display: block; margin-top: 3px; font-size: 12.5px; color: #687762; }
    .chapter-grid a.is-empty .chapter-count { color: #a9b79d; }
    .cards-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 22px; }
    .empty-chapter, .stage-not-found { grid-column: 1 / -1; margin: 0; color: #687762; line-height: 1.5; }
    .stage-not-found { margin-top: 12px; padding: 10px 14px; border-radius: 10px; background: #fff3e0; color: #7a5a1e; }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }
    .stage { overflow: hidden; border: 1px solid #d8e0cc; border-radius: 15px; background: #fff; scroll-margin-top: 140px; }
    .stage.highlight { outline: 3px solid #477c38; outline-offset: 2px; }
    h2.stage-title { display: flex; align-items: center; font-size: 20px; font-weight: 700; line-height: 1.3; letter-spacing: -.4px; margin: 0; }
    h2.stage-title a { display: block; flex: 1; min-width: 0; padding: 14px 14px 12px 18px; color: inherit; text-decoration: none; }
    h2.stage-title a:hover { color: #477c38; }
    h2.stage-title a:focus-visible { outline: 3px solid #477c38; outline-offset: -4px; border-radius: 10px; }
    .level { flex-shrink: 0; padding: 5px 8px; margin: 0 8px 0 0; border-radius: 8px; background: #edf2e6; color: #486342; font-size: 12px; font-weight: 650; line-height: 1.25; letter-spacing: 0; text-align: center; white-space: nowrap; }
    .poster { margin: -2px 18px 12px; color: #687762; font-size: 12px; line-height: 1.4; overflow-wrap: anywhere; }
    .poster a { color: inherit; text-decoration: none; }
    .poster a:hover { color: #477c38; text-decoration: underline; }
    .board { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 3px; padding: 10px; background: #d2e2ad; }
    .cell { aspect-ratio: 1; min-width: 0; position: relative; display: flex; align-items: center; justify-content: center; background: #e9f0d4; border-radius: 4px; }
    .cell:nth-child(even) { background: #e0eac7; }
    .cell img { display: block; width: 100%; height: 100%; object-fit: contain; user-select: none; }
    .occupied:hover { background: #f4f7e6; }
    .privacy-content { max-width: 760px; line-height: 1.6; }
    .privacy-content h2 { font-size: 18px; margin: 22px 0 8px; }
    .privacy-content p { margin: 0 0 12px; }
    .site-footer { max-width: 1440px; margin: 0 auto; padding: 20px 24px 36px; width: 90%; color: #687762; font-size: 13px; line-height: 1.6; }
    .site-footer p { margin: 0 0 6px; }
    .site-footer nav a { text-decoration: none; margin-right: 4px; }
    .site-footer nav a:hover { color: #477c38; text-decoration: underline; }
    @media (min-width: 851px) { .page-header, main, .chapter-pagination, .site-footer { width: 90%; } h2.stage-title { font-size: clamp(18px, 1.35vw, 23.4px); } .level, .poster { font-size: 12.6px; } }
    @media (max-width: 850px) { .cards-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); max-width: 750px; gap: 18px; } .chapter-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } .page-header, main, .chapter-pagination, .site-footer { max-width: 750px; } }
    @media (max-width: 520px) {
      .cards-grid { grid-template-columns: 1fr; max-width: 420px; gap: 18px; }
      .chapter-grid { grid-template-columns: 1fr; }
      main { padding: 10px 12px 32px; }
      .page-header { max-width: 420px; padding: 12px 12px 10px; }
      .header-controls { flex-wrap: wrap; gap: 10px; }
      .chapter-picker { flex: 1; min-width: 0; gap: 8px; }
      .chapter-picker label { font-size: 14px; }
      select { flex: 1; min-width: 0; width: 100%; padding-left: 10px; padding-right: 28px; font-size: 14px; }
      .stage-search input { width: 100px; }
      .donation-links { flex-shrink: 0; }
      .donation-label, .donation-text-desktop { display: none; }
      .donation-text-mobile { display: inline; }
      .donation-link { min-height: 36px; padding: 6px 9px; font-size: 12px; border-radius: 8px; }
      h2.stage-title { font-size: 18px; }
      h2.stage-title a { padding-left: 14px; }
      .level { margin-right: 6px; }
      .poster { margin-left: 14px; }
      .board { padding: 7px; gap: 2px; }
    }
    @media print { :root { background: white; } .header-controls, .chapter-pagination, .site-footer { display: none; } main { width: auto; max-width: none; padding: 0; gap: 12px; } .stage { break-inside: avoid; } }

  <script>window.SITE_CONFIG = <!-- JS_CONFIG_JSON -->;</script>
  <script>
    (function () {
      var CFG = window.SITE_CONFIG;
      var chapterSelect = document.getElementById('chapter-select');
      var searchForm = document.getElementById('stage-search-form');
      var searchInput = document.getElementById('stage-search-input');
      var searchStatus = document.getElementById('stage-search-status');

      function gaEvent(name, params) {
        if (typeof gtag === 'function') {
          gtag('event', name, Object.assign({ transport_type: 'beacon' }, params || {}));
        }
      }

      chapterSelect.addEventListener('change', function () {
        window.location.href = CFG.langPrefix + '/chapter/' + chapterSelect.value + '/';
      });

      function parseStageQuery(raw) {
        var match = /^\s*(\d{1,2})\s*[-.\s]\s*(\d{1,3})\s*$/.exec(raw || '');
        if (!match) return null;
        return { chapter: parseInt(match[1], 10), stage: parseInt(match[2], 10) };
      }

      searchForm.addEventListener('submit', function (event) {
        event.preventDefault();
        var raw = searchInput.value.trim();
        var parsed = parseStageQuery(raw);
        if (!parsed) {
          searchStatus.textContent = CFG.strings.searchInvalid;
          gaEvent('stage_search', { search_term: raw, found: false, language: CFG.lang });
          return;
        }
        try {
          sessionStorage.setItem('pendingStageSearch', JSON.stringify({ raw: raw, chapter: parsed.chapter, stage: parsed.stage }));
        } catch (e) {}
        window.location.href = CFG.langPrefix + '/chapter/' + parsed.chapter + '/#stage-' + parsed.chapter + '-' + parsed.stage;
      });

      function resolveStageHash() {
        var hash = window.location.hash;
        var match = /^#stage-(\d+)-(\d+)$/.exec(hash);
        var notFound = document.getElementById('stage-not-found');
        if (notFound) notFound.hidden = true;
        document.querySelectorAll('.stage.highlight').forEach(function (el) { el.classList.remove('highlight'); });
        if (!match) return;
        var chapter = match[1], stage = match[2];
        var directEl = document.getElementById('stage-' + chapter + '-' + stage);
        var targetEl = directEl;
        if (!targetEl) {
          var needle = chapter + '-' + stage;
          document.querySelectorAll('.stage[data-stages]').forEach(function (el) {
            if (targetEl) return;
            var stages = el.getAttribute('data-stages').split(',');
            if (stages.indexOf(needle) !== -1) targetEl = el;
          });
        }
        var pending = null;
        try {
          var raw = sessionStorage.getItem('pendingStageSearch');
          if (raw) { pending = JSON.parse(raw); sessionStorage.removeItem('pendingStageSearch'); }
        } catch (e) {}
        if (pending && String(pending.chapter) === chapter && String(pending.stage) === stage) {
          gaEvent('stage_search', { search_term: pending.raw, found: !!targetEl, language: CFG.lang });
        }
        if (targetEl) {
          targetEl.classList.add('highlight');
          targetEl.scrollIntoView({ behavior: 'smooth', block: 'start' });
        } else if (notFound) {
          notFound.textContent = CFG.strings.searchNotFound.replace('{chapter}', chapter).replace('{stage}', stage);
          notFound.hidden = false;
        }
      }
      if (CFG.pageType === 'chapter') {
        window.addEventListener('hashchange', resolveStageHash);
        resolveStageHash();
        gaEvent('chapter_view', { chapter: CFG.chapter, language: CFG.lang });
      }

      if (CFG.pageType === 'home') {
        var hashMatch = /^#chapter-(\d+)$/.exec(window.location.hash);
        if (hashMatch) {
          window.location.replace(CFG.langPrefix + '/chapter/' + hashMatch[1] + '/');
        }
        var params = new URLSearchParams(window.location.search);
        var stageParam = params.get('stage');
        if (stageParam) {
          var parsedStage = parseStageQuery(stageParam);
          if (parsedStage) {
            try {
              sessionStorage.setItem('pendingStageSearch', JSON.stringify({ raw: stageParam, chapter: parsedStage.chapter, stage: parsedStage.stage }));
            } catch (e) {}
            window.location.replace(CFG.langPrefix + '/chapter/' + parsedStage.chapter + '/#stage-' + parsedStage.chapter + '-' + parsedStage.stage);
          }
        }
      }

      document.addEventListener('click', function (event) {
        var donate = event.target.closest('a.donation-link, a[href*="paypal.com/donate"]');
        if (donate) {
          gaEvent('donate_click', { site: 'critterformations', link: 'paypal', language: CFG.lang });
          return;
        }
        var sourceLink = event.target.closest('h2.stage-title a, .poster a');
        if (sourceLink) {
          var card = sourceLink.closest('.stage');
          gaEvent('source_click', {
            chapter: card ? card.getAttribute('data-chapter') : CFG.chapter,
            stage: card ? card.id.replace(/^stage-/, '') : null,
            link_type: sourceLink.closest('h2.stage-title') ? 'stage_title' : 'poster',
            language: CFG.lang,
          });
          return;
        }
      });
    })();
  </script>
