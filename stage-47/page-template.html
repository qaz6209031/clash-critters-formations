    @media (max-width: 850px) { .cards-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); max-width: 750px; gap: 18px; } .chapter-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } .page-header, main, .site-footer { max-width: 750px; } }

  <script>
    (function () {
      var CFG = window.SITE_CONFIG;
      var chapterSelect = document.getElementById('chapter-select');

      function gaEvent(name, params) {
        if (typeof gtag === 'function') {
          gtag('event', name, Object.assign({ transport_type: 'beacon' }, params || {}));
        }
      }

      chapterSelect.addEventListener('change', function () {
        window.location.href = CFG.langPrefix + '/chapter/' + chapterSelect.value + '/';
      });

      if (CFG.pageType === 'chapter') {
        gaEvent('chapter_view', { chapter: CFG.chapter, language: CFG.lang });
      }

      if (CFG.pageType === 'home') {
        var hashMatch = /^#chapter-(\d+)$/.exec(window.location.hash);
        if (hashMatch) {
          window.location.replace(CFG.langPrefix + '/chapter/' + hashMatch[1] + '/');
        }
      }

      document.addEventListener('click', function (event) {
        var donate = event.target.closest('a.donation-link, a[href*="paypal.com/donate"]');
        if (donate) {
          gaEvent('donate_click', { site: 'critterformations', link: 'paypal', language: CFG.lang });
          return;
        }
        var sourceLink = event.target.closest('h2.stage-title a, .poster a');
        if (sourceLink) {
          var card = sourceLink.closest('.stage');
          gaEvent('source_click', {
            chapter: card ? card.getAttribute('data-chapter') : CFG.chapter,
            stage: card ? card.id.replace(/^stage-/, '') : null,
            link_type: sourceLink.closest('h2.stage-title') ? 'stage_title' : 'poster',
            language: CFG.lang,
          });
          return;
        }
      });
    })();
  </script>
