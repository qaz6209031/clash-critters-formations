<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f7f0">
  <meta name="description" content="Clash of Critters formations and observed Tatari levels for all 80 Main Stages in chapters 44, 45, 46, 47, 48, 49 and 50.">
  <title>Stages 44–50 · Clash of Critters Formations</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%232c4833'/%3E%3Cpath d='M20 12v40M32 12v40M44 12v40M12 20h40M12 32h40M12 44h40' stroke='%23c3dd95' stroke-width='3'/%3E%3C/svg%3E">
  <style>
    * { box-sizing: border-box; }
    :root { color-scheme: light; font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #243b2b; background: #f5f7f0; }
    body { margin: 0; }
    main { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 22px; max-width: 1140px; margin: 0 auto; padding: 28px 24px 48px; }
    .chapter-title { grid-column: 1 / -1; margin: 0; padding: 2px 0 0; font-size: 18px; font-weight: 650; color: #536b49; scroll-margin-top: 20px; }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }
    .stage { overflow: hidden; border: 1px solid #d8e0cc; border-radius: 15px; background: #fff; }
    h2 { display: flex; align-items: center; font-size: 20px; font-weight: 700; line-height: 1.3; letter-spacing: -.4px; margin: 0; }
    h2 a { display: block; flex: 1; min-width: 0; padding: 14px 14px 12px 18px; color: inherit; text-decoration: none; }
    h2 a:hover { color: #477c38; }
    h2 a:focus-visible { outline: 3px solid #477c38; outline-offset: -4px; border-radius: 10px; }
    .level { flex-shrink: 0; padding: 5px 8px; margin: 0 14px 0 0; border-radius: 8px; background: #edf2e6; color: #486342; font-size: 12px; font-weight: 650; line-height: 1.25; letter-spacing: 0; text-align: center; white-space: nowrap; }
    .level small { display: block; margin-top: 2px; font-size: 10px; font-weight: 500; }
    .board { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 3px; padding: 10px; background: #d2e2ad; }
    .cell { aspect-ratio: 1; min-width: 0; position: relative; display: flex; align-items: center; justify-content: center; background: #e9f0d4; border-radius: 4px; }
    .cell:nth-child(even) { background: #e0eac7; }
    .cell img { display: block; width: 100%; height: 100%; object-fit: contain; user-select: none; }
    .occupied:hover { background: #f4f7e6; }
    @media (max-width: 850px) { main { grid-template-columns: repeat(2, minmax(0, 1fr)); max-width: 750px; gap: 18px; } }
    @media (max-width: 520px) { main { grid-template-columns: 1fr; max-width: 420px; padding: 16px 16px 32px; gap: 20px; } }
    @media print { :root { background: white; } main { max-width: none; padding: 0; gap: 12px; } .stage { break-inside: avoid; } }
  </style>
</head>
<body>
  <h1 class="sr-only">Main Stage chapters 44, 45, 46, 47, 48, 49 and 50 formations and Tatari levels</h1>
  <main aria-label="Stage formations">
    <!-- STAGE_CARDS -->
  </main>
  <script>
    const sprites = /* SPRITE_DATA */ {};
    document.querySelectorAll('img[data-sprite]').forEach(image => {
      image.src = sprites[image.dataset.sprite];
    });
  </script>
</body>
</html>
